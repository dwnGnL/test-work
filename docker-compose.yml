services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      # Наружу только на localhost и на нестандартном порту: 5432 часто занят локальным Postgres.
      # Нужен для интеграционных тестов (make test).
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: на время инициализации образ поднимает временный сервер только на сокете;
      # проверка по TCP становится зелёной лишь после запуска настоящего.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U payments -d payments"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    # Сервер ждёт завершения запросов до 10 с (shutdownTimeout в cmd/server), а compose по умолчанию
    # убивает контейнер через те же 10 с. Запас, чтобы остановка не обрывалась SIGKILL.
    stop_grace_period: 20s
    ports:
      # Порт на хосте настраивается: 8080 часто занят другими проектами.
      # Наружу только на localhost: при DEMO_SEED в базе демо-партнёры с публичными ключами.
      - "127.0.0.1:${APP_PORT:-18080}:8080"
    environment:
      DATABASE_URL: postgres://payments:payments@db:5432/payments?sslmode=disable
      HTTP_ADDR: ":8080"
      CONFIRMATIONS: "3"
      INVOICE_TTL: 60m
      # Демо-партнёры alpha и beta (ключи demo-key-alpha и demo-key-beta) для ручной проверки.
      DEMO_SEED: ${DEMO_SEED:-true}
      # Демо-адрес для проверки ветки «высокий риск»; можно переопределить через окружение.
      AML_BLACKLIST: ${AML_BLACKLIST:-0x000000000000000000000000000000000000dEaD}
      USDT_CONTRACT: "0xdAC17F958D2ee523a2206206994597C13D831ec7"

volumes:
  pgdata:
